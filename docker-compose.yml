# docker compose up --build   ->  UI http://localhost:8000, API docs http://localhost:8000/docs
#
# Without AWS credentials it runs on the local sample engine. For live Bedrock, the container
# reads your AWS config read-only from ~/.aws. Pick a profile with AWS_PROFILE,
# e.g. `AWS_PROFILE=chartsight docker compose up`.
services:
  chartsight:
    build: .
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      CHARTSIGHT_API_KEY: ${CHARTSIGHT_API_KEY:-}
    volumes:
      - ~/.aws:/home/chartsight/.aws:ro
