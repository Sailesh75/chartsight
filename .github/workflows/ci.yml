name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests
        run: pytest

      - name: Eval harness (sample engine — no AWS credentials in CI)
        run: python -m evals.generate --count 60 --seed 7 && python -m evals.run --mode mock

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/report.md
            evals/report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t chartsight-api .

      - name: Smoke-test the API container (sample engine, no AWS)
        run: |
          docker run -d --name api -p 8000:8000 -e CHARTSIGHT_API_KEY=ci-key chartsight-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          # the web UI is served from the same container
          curl -fs localhost:8000/ | grep -q "<title>ChartSight</title>"
          # auth is enforced ...
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/analyze \
            -H 'content-type: application/json' -d '{"text":"x"}')" = "401"
          # ... and a real request works end to end
          curl -fs -X POST localhost:8000/v1/analyze -H 'X-API-Key: ci-key' \
            -H 'content-type: application/json' \
            -d '{"text":"Assessment: 72-year-old male with chronic kidney disease.","mode":"mock"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['conditions'][0]['code']=='N18.9', d; print('RAF', d['raf']['payment'])"
          test "$(docker inspect -f '{{.Config.User}}' chartsight-api)" = "chartsight"

      - name: Container logs
        if: always()
        run: docker logs api || true

  # Builds the image, pushes it to ECR and points Lambda at it. Runs only on pushes to master,
  # and only once the AWS_DEPLOY_ROLE_ARN repo variable exists (see infra/README.md).
  # Authenticates with GitHub OIDC: no AWS keys are stored in GitHub.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
    concurrency: deploy
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      FUNCTION: ${{ vars.LAMBDA_FUNCTION || 'chartsight' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'chartsight' }}
        run: |
          # --provenance=false: Lambda rejects the multi-manifest images buildx makes by default
          docker buildx build --provenance=false --platform linux/amd64 \
            -t "$REPO:$GITHUB_SHA" -t "$REPO:latest" --push .
          echo "IMAGE=$REPO:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Update the Lambda function
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "::notice::Function '$FUNCTION' doesn't exist yet. Image pushed; run 'terraform apply' to create it."
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION" --query FunctionUrl --output text)
          for i in $(seq 1 10); do curl -fs "${URL}health" && break; sleep 3; done
          curl -fs "$URL" | grep -q "<title>ChartSight</title>"
          echo "::notice::Deployed $IMAGE to $URL"
