[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartsight"
version = "0.2.0"
description = "Evidence-linked HCC coding — an LLM pipeline that codes clinical notes to ICD-10-CM with citations and flags risk-adjustment documentation gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sailesh Kafle" }]
# Core = the pipeline + batch CLI. Each way of serving it is an extra, so the API image
# doesn't ship Streamlit and the UI doesn't ship an ASGI server.
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
ui = [
    "streamlit>=1.37",
]
dev = [
    "chartsight[api,ui]",
    "httpx>=0.27",  # fastapi.testclient
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "boto3-stubs[bedrock-runtime]>=1.34",
]

[project.scripts]
chartsight = "chartsight.cli:main"

[tool.setuptools]
packages = ["chartsight"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by `ruff format`
allowed-confusables = ["–", "—", "×"]  # en/em dashes and × are intentional in clinical/UI text

[tool.mypy]
python_version = "3.12"  # matches the dev venv's interpreter; keeps mypy able to parse
# transitive stubs (e.g. numpy, pulled in by pytest) that use 3.12+ syntax. The project
# itself still supports >=3.11 (see [project]) — this doesn't require 3.12+ syntax in our code.
strict = true
warn_unreachable = true
files = ["chartsight", "evals", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
